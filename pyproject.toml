[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasin-relay"
dynamic = ["version"]
description = "YasinRelay: Telegram channel relay with AI processing for the Yasin ecosystem"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.dynamic]
version = {attr = "yasinrelay.__version__"}

[tool.setuptools.packages.find]
include = ["yasinrelay*", "yasin_relay*"]

[tool.setuptools]
script-files = ["scripts/yasinrelay-termux"]
