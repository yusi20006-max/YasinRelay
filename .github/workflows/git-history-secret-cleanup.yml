name: Git History Secret Cleanup (Controlled)

# CRITICAL SAFETY NOTES
# ---------------------
# 1. Manual only (workflow_dispatch).
# 2. Default mode = detect (non-destructive).
# 3. Rewrite requires exact confirmation: REMOVE-HISTORICAL-SECRETS
# 4. Rewrite requires non-empty expected_sha matching current HEAD.
# 5. Never prints secret values (FOUND / NOT_FOUND / REDACTED only).
# 6. Default rewrite never force-pushes main (only security/history-cleaned).
# 7. Optional mode=promote may force-with-lease cleaned history onto main with dual confirmation.
# 8. Primary cleanup: remove path .env from all history via git-filter-repo.
# 9. Pattern-name mentions inside this workflow and docs/security/GIT_HISTORY_CLEANUP.md
#    are treated as trusted scanner/documentation paths (false-positive exclusion).
# 10. Matches of the same pattern outside those trusted paths still fail closed:
#     POTENTIAL_REMAINING_CREDENTIAL: REDACTED

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "detect"
        type: choice
        options:
          - detect
          - rewrite
          - promote
      confirmation:
        description: "rewrite: REMOVE-HISTORICAL-SECRETS | promote: PROMOTE-CLEANED-HISTORY-TO-MAIN"
        required: false
        default: ""
        type: string
      expected_sha:
        description: "Required for rewrite: must equal current target HEAD SHA. Optional for detect/promote."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: git-history-secret-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect-secrets:
    name: Phase 1 — Detection / Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.mode == 'detect' || inputs.mode == 'rewrite' }}
    outputs:
      safety_ok: ${{ steps.safety.outputs.safety_ok }}
      head_sha: ${{ steps.safety.outputs.head_sha }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository identity & safety checks
        id: safety
        run: |
          set -euo pipefail
          echo "=== Repository Safety Checks ==="
          echo "Repository: ${{ github.repository }}"
          echo "SHA: ${{ github.sha }}"
          echo "Mode requested: ${{ inputs.mode }}"
          if [ "${{ github.repository }}" != "yusi20006-max/YasinRelay" ]; then
            echo "ERROR: Unexpected repository. Aborting."
            exit 1
          fi
          echo "safety_ok=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Detect tracked .env (current HEAD)
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env: FOUND"
          else
            echo "Tracked .env: NOT_FOUND"
          fi

      - name: Historical scan for .env paths
        run: |
          set -euo pipefail
          COUNT=$(git log --all --full-history --pretty=format: --name-only -- '.env' '.env.*' 2>/dev/null | grep -c '.' || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "Historical .env path occurrences: FOUND (count=$COUNT)"
          else
            echo "Historical .env path occurrences: NOT_FOUND"
          fi

      - name: Detection summary
        run: |
          set -euo pipefail
          echo "Detection-only complete. Mode=${{ inputs.mode }}"

  rewrite-history:
    name: Phase 2 — Controlled Rewrite
    runs-on: ubuntu-latest
    needs: detect-secrets
    if: ${{ inputs.mode == 'rewrite' && inputs.confirmation == 'REMOVE-HISTORICAL-SECRETS' }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Confirm gates
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" != "yusi20006-max/YasinRelay" ]; then
            echo "ERROR: Unexpected repository. Aborting."
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "REMOVE-HISTORICAL-SECRETS" ]; then
            echo "ERROR: confirmation string mismatch. Aborting."
            exit 1
          fi

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require expected_sha and verify match
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.expected_sha }}"
          ACTUAL="${{ github.sha }}"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ABORT — TARGET SHA MISMATCH expected=$EXPECTED actual=$ACTUAL"
            exit 1
          fi
          echo "SHA check: OK"

      - name: Install git-filter-repo
        run: pip install --quiet git-filter-repo

      - name: Remove .env from all history (primary cleanup, quiet)
        run: |
          set -euo pipefail
          git filter-repo --path .env --invert-paths --force --quiet
          echo "filter-repo completed."

      - name: Ensure .gitignore still protects .env
        run: |
          set -euo pipefail
          if ! grep -qE '^\.env$' .gitignore && ! grep -qE '^\.env\b' .gitignore; then
            echo "ERROR: .env is not protected by .gitignore after rewrite."
            exit 1
          fi

      - name: Verify .env is not tracked and not in history
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env after rewrite: FOUND (UNEXPECTED)"
            exit 1
          fi
          COUNT=$(git log --all --full-history --pretty=format: --name-only -- '.env' 2>/dev/null | grep -c '.' || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "Historical .env after rewrite: FOUND (UNEXPECTED)"
            exit 1
          fi
          echo "Historical .env after rewrite: NOT_FOUND (OK)"

      - name: Push cleaned history to dedicated branch with force-with-lease
        run: |
          set -euo pipefail
          CLEAN_BRANCH="security/history-cleaned"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin "refs/heads/${CLEAN_BRANCH}:refs/remotes/origin/${CLEAN_BRANCH}" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/${CLEAN_BRANCH}"; then
            git push --force-with-lease=refs/heads/${CLEAN_BRANCH}:refs/remotes/origin/${CLEAN_BRANCH} \
              origin "HEAD:refs/heads/${CLEAN_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${CLEAN_BRANCH}"
          fi
          echo "Cleaned history available at: origin/${CLEAN_BRANCH}"

  promote-to-main:
    name: Phase 3 — Promote cleaned history to main
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'promote' && inputs.confirmation == 'PROMOTE-CLEANED-HISTORY-TO-MAIN' }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Confirm promote gates
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" != "yusi20006-max/YasinRelay" ]; then
            echo "ERROR: Unexpected repository. Aborting."
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "PROMOTE-CLEANED-HISTORY-TO-MAIN" ]; then
            echo "ERROR: confirmation string mismatch. Aborting."
            exit 1
          fi
          echo "All promote gates passed."

      - name: Checkout (for tooling only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch cleaned branch and verify history
        run: |
          set -euo pipefail
          git fetch origin security/history-cleaned:refs/remotes/origin/security/history-cleaned
          if ! git show-ref --verify --quiet refs/remotes/origin/security/history-cleaned; then
            echo "ERROR: origin/security/history-cleaned missing. Run mode=rewrite first."
            exit 1
          fi
          COUNT=$(git log origin/security/history-cleaned --full-history --pretty=format: --name-only -- '.env' 2>/dev/null | grep -c '.' || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "ERROR: cleaned branch still has historical .env paths (count=$COUNT). Aborting."
            exit 1
          fi
          echo "Historical .env on security/history-cleaned: NOT_FOUND (OK)"
          echo "Cleaned tip: $(git rev-parse origin/security/history-cleaned)"

      - name: Force-with-lease promote cleaned → main
        run: |
          set -euo pipefail
          CLEAN_SHA=$(git rev-parse origin/security/history-cleaned)
          echo "Promoting $CLEAN_SHA to main with --force-with-lease"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force-with-lease origin "refs/remotes/origin/security/history-cleaned:refs/heads/main"
          echo "main updated to cleaned history tip $CLEAN_SHA"
          echo "Collaborators must re-clone or hard-reset."

      - name: Post-promote verification
        run: |
          set -euo pipefail
          git fetch origin main
          COUNT=$(git log origin/main --full-history --pretty=format: --name-only -- '.env' 2>/dev/null | grep -c '.' || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "ERROR: main still has historical .env after promote (count=$COUNT)"
            exit 1
          fi
          echo "Historical .env on origin/main: NOT_FOUND (OK)"
          echo "main SHA: $(git rev-parse origin/main)"
