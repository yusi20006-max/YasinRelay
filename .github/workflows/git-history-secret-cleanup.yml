name: Git History Secret Cleanup (Controlled)

# CRITICAL SAFETY NOTES
# ---------------------
# 1. Manual only (workflow_dispatch).
# 2. Default mode = detect (non-destructive).
# 3. Rewrite requires exact confirmation: REMOVE-HISTORICAL-SECRETS
# 4. Rewrite requires non-empty expected_sha matching current HEAD.
# 5. Never prints secret values (FOUND / NOT_FOUND / REDACTED only).
# 6. Never force-pushes main.
# 7. Cleaned history is pushed only to security/history-cleaned with --force-with-lease.
# 8. Primary cleanup: remove path .env from all history via git-filter-repo.
# 9. If residual EITAA_TOKEN remains after .env removal, stop and report
#    POTENTIAL_REMAINING_CREDENTIAL: REDACTED (no guessed replacement).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "detect"
        type: choice
        options:
          - detect
          - rewrite
      confirmation:
        description: "For rewrite mode must be exactly: REMOVE-HISTORICAL-SECRETS"
        required: false
        default: ""
        type: string
      expected_sha:
        description: "Required for rewrite: must equal current target HEAD SHA. Optional for detect."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: git-history-secret-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # Phase 1 — Detection (always safe)
  # ==========================================================
  detect-secrets:
    name: Phase 1 — Detection / Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      safety_ok: ${{ steps.safety.outputs.safety_ok }}
      head_sha: ${{ steps.safety.outputs.head_sha }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository identity & safety checks
        id: safety
        run: |
          set -euo pipefail
          echo "=== Repository Safety Checks ==="
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Mode requested: ${{ inputs.mode }}"
          echo "Confirmation provided: $([ -n \"${{ inputs.confirmation }}\" ] && echo YES || echo NO)"

          if [ "${{ github.repository }}" != "yusi20006-max/YasinRelay" ]; then
            echo "ERROR: Unexpected repository. Aborting."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "WARNING: Working tree is not clean."
          else
            echo "Working tree: clean"
          fi

          echo "safety_ok=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Inspect .gitignore protection
        run: |
          set -euo pipefail
          echo "=== .gitignore Inspection ==="
          if [ -f .gitignore ]; then
            echo ".gitignore: FOUND"
            if grep -qE '^\.env$' .gitignore || grep -qE '^\.env\b' .gitignore; then
              echo ".env protection: FOUND"
            else
              echo ".env protection: NOT_FOUND"
            fi
            if grep -qE '\.env\.' .gitignore || grep -qE '\.env\*' .gitignore; then
              echo ".env.* protection: FOUND"
            else
              echo ".env.* protection: NOT_FOUND"
            fi
          else
            echo ".gitignore: NOT_FOUND"
          fi

      - name: Detect tracked .env (current HEAD)
        run: |
          set -euo pipefail
          echo "=== Current HEAD — Tracked Secret-like Files ==="
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env: FOUND"
          else
            echo "Tracked .env: NOT_FOUND"
          fi
          echo "Other candidate files (names only):"
          git ls-files | grep -E '\.env|secret|credential|token|key\.json|id_rsa' || echo "(none matched)"

      - name: Historical scan for .env paths
        run: |
          set -euo pipefail
          echo "=== Historical .env Path Scan ==="
          COUNT=$(git log --all --full-history --pretty=format: --name-only -- '.env' '.env.*' 2>/dev/null | grep -c '.' || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "Historical .env path occurrences: FOUND (count=$COUNT)"
          else
            echo "Historical .env path occurrences: NOT_FOUND"
          fi
          echo "Unique historical sensitive-looking paths:"
          git log --all --full-history --pretty=format: --name-only 2>/dev/null \
            | grep -E '\.env|secret|credential|token' | sort -u | head -50 || echo "(none)"

      - name: Scan history for EITAA_TOKEN (presence-only, redacted)
        run: |
          set -euo pipefail
          echo "=== Historical EITAA_TOKEN Pattern Scan (REDACTED) ==="
          FOUND=0
          if [ -n "$(git log --all --pretty=format:'%H' -S'EITAA_TOKEN' 2>/dev/null | head -1)" ]; then
            FOUND=1
          fi
          if [ "$FOUND" -eq 0 ]; then
            if [ -n "$(git log --all --pretty=format:'%H' -G'EITAA_TOKEN' 2>/dev/null | head -1)" ]; then
              FOUND=1
            fi
          fi
          if [ "$FOUND" -eq 0 ]; then
            if git rev-list --all 2>/dev/null | xargs -r git grep -I -l -F 'EITAA_TOKEN' -- 2>/dev/null | grep -q .; then
              FOUND=1
            fi
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "EITAA_TOKEN string in history: FOUND"
            echo "Potential credential detected: REDACTED"
          else
            echo "EITAA_TOKEN string in history: NOT_FOUND"
          fi
          echo "(Matching content intentionally suppressed)"

      - name: Current-tree presence-only credential pattern scan (redacted)
        run: |
          set -euo pipefail
          echo "=== Current Tree Credential Pattern Scan (REDACTED) ==="
          # Presence-only scan of tracked text files. Never print matching lines.
          # Patterns are intentionally generic; values are never echoed.
          FOUND=0
          # Common high-signal key names / formats (presence only)
          if git grep -I -l -E '(EITAA_TOKEN|API_KEY|SECRET_KEY|PRIVATE_KEY|AWS_SECRET|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' -- . 2>/dev/null | grep -q .; then
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "Credential-like pattern in current tree: FOUND"
            echo "Potential credential detected: REDACTED"
          else
            echo "Credential-like pattern in current tree: NOT_FOUND"
          fi
          echo "(Matching content intentionally suppressed)"

      - name: Detection summary
        run: |
          set -euo pipefail
          echo "=============================================="
          echo "  DETECTION SUMMARY (no secrets printed)"
          echo "=============================================="
          echo "Repository : ${{ github.repository }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Mode       : ${{ inputs.mode }}"
          echo "=============================================="
          echo "Detection-only complete. No history rewritten."
          echo "=============================================="

  # ==========================================================
  # Phase 2 — Controlled Rewrite (gated)
  # ==========================================================
  rewrite-history:
    name: Phase 2 — Controlled Rewrite
    runs-on: ubuntu-latest
    needs: detect-secrets
    if: ${{ inputs.mode == 'rewrite' && inputs.confirmation == 'REMOVE-HISTORICAL-SECRETS' }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Confirm gates
        run: |
          set -euo pipefail
          echo "=== Rewrite Gate Checks ==="
          echo "Mode: ${{ inputs.mode }}"
          echo "Confirmation matches required string: YES"
          echo "Repository: ${{ github.repository }}"

          if [ "${{ github.repository }}" != "yusi20006-max/YasinRelay" ]; then
            echo "ERROR: Unexpected repository. Aborting."
            exit 1
          fi

          if [ "${{ inputs.mode }}" != "rewrite" ]; then
            echo "ERROR: mode is not rewrite. Aborting."
            exit 1
          fi

          if [ "${{ inputs.confirmation }}" != "REMOVE-HISTORICAL-SECRETS" ]; then
            echo "ERROR: confirmation string mismatch. Aborting."
            exit 1
          fi

          echo "All primary rewrite gates passed."

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require expected_sha and verify match
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.expected_sha }}"
          ACTUAL="${{ github.sha }}"
          echo "Actual SHA: $ACTUAL"

          if [ -z "$EXPECTED" ]; then
            echo "ABORT — TARGET SHA MISMATCH"
            echo "ERROR: expected_sha is required for mode=rewrite and must equal current HEAD."
            exit 1
          fi

          echo "Expected SHA: $EXPECTED"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ABORT — TARGET SHA MISMATCH"
            echo "ERROR: expected_sha does not match current target SHA. Refusing to rewrite."
            exit 1
          fi

          echo "SHA check: OK"

      - name: Create safety backup tag
        id: backup
        run: |
          set -euo pipefail
          TAG="backup/pre-secret-cleanup-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Safety backup before historical .env removal (sha ${{ github.sha }})"
          git push origin "refs/tags/$TAG"
          echo "backup_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Backup tag created and pushed: $TAG"

      - name: Install git-filter-repo
        run: pip install --quiet git-filter-repo

      - name: Remove .env from all history (primary cleanup, quiet)
        run: |
          set -euo pipefail
          echo "=== Primary rewrite: remove path .env from all history ==="
          # Quiet filter-repo: suppress normal progress; keep stderr on failure.
          # Path-only removal; no secret values are printed by this command.
          git filter-repo --path .env --invert-paths --force --quiet
          echo "filter-repo completed (path .env removed from history)."

      - name: Ensure .gitignore still protects .env
        run: |
          set -euo pipefail
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore missing after rewrite."
            exit 1
          fi
          if ! grep -qE '^\.env$' .gitignore && ! grep -qE '^\.env\b' .gitignore; then
            echo "ERROR: .env is not protected by .gitignore after rewrite."
            exit 1
          fi
          echo ".gitignore .env protection: FOUND"

      - name: Verify .env is not tracked and not in history
        run: |
          set -euo pipefail
          echo "=== Post-rewrite verification ==="

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env after rewrite: FOUND (UNEXPECTED)"
            exit 1
          else
            echo "Tracked .env after rewrite: NOT_FOUND (OK)"
          fi

          COUNT=$(git log --all --full-history --pretty=format: --name-only -- '.env' 2>/dev/null | grep -c '.' || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "Historical .env after rewrite: FOUND (count=$COUNT) (UNEXPECTED)"
            exit 1
          else
            echo "Historical .env after rewrite: NOT_FOUND (OK)"
          fi

      - name: Presence-only re-scan for EITAA_TOKEN after rewrite
        run: |
          set -euo pipefail
          echo "=== Post-rewrite EITAA_TOKEN scan (REDACTED) ==="
          FOUND=0
          if [ -n "$(git log --all --pretty=format:'%H' -S'EITAA_TOKEN' 2>/dev/null | head -1)" ]; then
            FOUND=1
          fi
          if [ "$FOUND" -eq 0 ]; then
            if [ -n "$(git log --all --pretty=format:'%H' -G'EITAA_TOKEN' 2>/dev/null | head -1)" ]; then
              FOUND=1
            fi
          fi
          if [ "$FOUND" -eq 0 ]; then
            if git rev-list --all 2>/dev/null | xargs -r git grep -I -l -F 'EITAA_TOKEN' -- 2>/dev/null | grep -q .; then
              FOUND=1
            fi
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "EITAA_TOKEN string after rewrite: FOUND"
            echo "POTENTIAL_REMAINING_CREDENTIAL: REDACTED"
            echo "Stopping. Path removal of .env did not eliminate all occurrences."
            echo "A separate deliberate cleanup step is required."
            echo "No force-push to main will be performed by this workflow."
            exit 1
          else
            echo "EITAA_TOKEN string after rewrite: NOT_FOUND (OK)"
          fi

      - name: Current-tree presence-only credential pattern scan after rewrite
        run: |
          set -euo pipefail
          echo "=== Post-rewrite Current Tree Credential Pattern Scan (REDACTED) ==="
          FOUND=0
          if git grep -I -l -E '(EITAA_TOKEN|API_KEY|SECRET_KEY|PRIVATE_KEY|AWS_SECRET|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' -- . 2>/dev/null | grep -q .; then
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "Credential-like pattern in current tree after rewrite: FOUND"
            echo "POTENTIAL_REMAINING_CREDENTIAL: REDACTED"
            echo "Stopping before push of cleaned branch."
            exit 1
          else
            echo "Credential-like pattern in current tree after rewrite: NOT_FOUND (OK)"
          fi
          echo "(Matching content intentionally suppressed)"

      - name: Push cleaned history to dedicated branch with force-with-lease
        run: |
          set -euo pipefail
          CLEAN_BRANCH="security/history-cleaned"
          echo "Preparing safe push to origin/$CLEAN_BRANCH"
          echo "This does NOT update main and does NOT force-push main."

          # After filter-repo the remote may have been removed; re-add origin
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Fetch remote cleaned-branch ref (if any) so force-with-lease can verify
          git fetch origin "refs/heads/${CLEAN_BRANCH}:refs/remotes/origin/${CLEAN_BRANCH}" 2>/dev/null || true

          # Only overwrite security/history-cleaned, and only if remote tip matches
          # what we last fetched (or branch is new). Never touches main.
          if git show-ref --verify --quiet "refs/remotes/origin/${CLEAN_BRANCH}"; then
            echo "Remote ${CLEAN_BRANCH} exists; using --force-with-lease against it."
            git push --force-with-lease=refs/heads/${CLEAN_BRANCH}:refs/remotes/origin/${CLEAN_BRANCH} \
              origin "HEAD:refs/heads/${CLEAN_BRANCH}"
          else
            echo "Remote ${CLEAN_BRANCH} does not exist yet; creating it."
            git push origin "HEAD:refs/heads/${CLEAN_BRANCH}"
          fi

          echo "Cleaned history available at: origin/${CLEAN_BRANCH}"
          echo "Backup tag: ${{ steps.backup.outputs.backup_tag }}"
          echo ""
          echo "NEXT STEP (manual, by maintainer):"
          echo "  1. Review origin/${CLEAN_BRANCH}"
          echo "  2. Compare with backup tag"
          echo "  3. If satisfied, force-push cleaned history to main from a trusted machine"
          echo "  4. Notify all collaborators to re-clone or reset hard"

      - name: Final rewrite summary
        run: |
          set -euo pipefail
          echo "=============================================="
          echo "  REWRITE SUMMARY (no secrets printed)"
          echo "=============================================="
          echo "Repository     : ${{ github.repository }}"
          echo "Backup tag     : ${{ steps.backup.outputs.backup_tag }}"
          echo "Cleaned branch : security/history-cleaned"
          echo "main force-push: NOT performed by this workflow"
          echo "=============================================="
