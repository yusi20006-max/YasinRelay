name: Git History Secret Cleanup (Controlled)

# CRITICAL SAFETY NOTES
# ---------------------
# 1. This workflow is MANUAL ONLY (workflow_dispatch).
# 2. Default mode is "detect" (non-destructive dry-run).
# 3. The destructive "rewrite" path is intentionally DISABLED in this version.
# 4. Even if mode=rewrite is selected, the workflow will refuse unless
#    confirmation == "REMOVE-HISTORICAL-SECRETS" AND a future enablement
#    flag is flipped by a deliberate follow-up PR.
# 5. Never prints actual secret values. Only FOUND / NOT_FOUND / REDACTED.
# 6. Does not rewrite main, does not force-push, does not delete branches/tags.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "detect"
        type: choice
        options:
          - detect
          - rewrite
      confirmation:
        description: "Required confirmation string for any destructive path (must be exactly REMOVE-HISTORICAL-SECRETS)"
        required: false
        default: ""
        type: string
      target_ref:
        description: "Git ref to inspect (default: HEAD of the branch that triggered the workflow)"
        required: false
        default: "HEAD"
        type: string

permissions:
  contents: read   # Minimum required for detection. No write permissions in this PR.

concurrency:
  group: git-history-secret-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect-secrets:
    name: Phase 1 — Detection / Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (full history for detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Need history for secret scanning
          persist-credentials: false

      - name: Repository identity & safety checks
        id: safety
        run: |
          set -euo pipefail

          echo "=== Repository Safety Checks ==="
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Mode requested: ${{ inputs.mode }}"
          echo "Confirmation provided: $([ -n \"${{ inputs.confirmation }}\" ] && echo YES || echo NO)"

          # Basic identity guard
          if [ "${{ github.repository }}" != "yusi20006-max/YasinRelay" ]; then
            echo "ERROR: Unexpected repository. Aborting."
            exit 1
          fi

          # Working tree should be clean after checkout
          if [ -n "$(git status --porcelain)" ]; then
            echo "WARNING: Working tree is not clean (unexpected after fresh checkout)."
          else
            echo "Working tree: clean"
          fi

          echo "safety_ok=true" >> "$GITHUB_OUTPUT"

      - name: Inspect .gitignore protection
        id: gitignore
        run: |
          set -euo pipefail
          echo "=== .gitignore Inspection ==="

          if [ -f .gitignore ]; then
            echo ".gitignore: FOUND"
            if grep -qE '^\.env$' .gitignore || grep -qE '^\.env\b' .gitignore; then
              echo ".env protection: FOUND"
            else
              echo ".env protection: NOT_FOUND (should be added)"
            fi
            if grep -qE '\.env\.' .gitignore || grep -qE '\.env\*' .gitignore; then
              echo ".env.* protection: FOUND"
            else
              echo ".env.* protection: NOT_FOUND (recommended)"
            fi
          else
            echo ".gitignore: NOT_FOUND"
          fi

      - name: Detect tracked .env and credential-like files (current HEAD)
        id: current
        run: |
          set -euo pipefail
          echo "=== Current HEAD — Tracked Secret-like Files ==="

          # Check if .env is currently tracked
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env: FOUND"
          else
            echo "Tracked .env: NOT_FOUND"
          fi

          # List other potentially sensitive tracked files (names only)
          echo "Other candidate files (names only):"
          git ls-files | grep -E '\.env|secret|credential|token|key\.json|id_rsa' || echo "(none matched)"

      - name: Historical scan for .env paths
        id: hist_env
        run: |
          set -euo pipefail
          echo "=== Historical .env Path Scan ==="

          # Count path mentions without showing file content
          COUNT=$(git log --all --full-history --pretty=format: --name-only -- '.env' '.env.*' 2>/dev/null | grep -c '.' || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "Historical .env path occurrences: FOUND (count=$COUNT)"
          else
            echo "Historical .env path occurrences: NOT_FOUND"
          fi

          # Unique historical paths that look sensitive (names only)
          echo "Unique historical sensitive-looking paths:"
          git log --all --full-history --pretty=format: --name-only 2>/dev/null \
            | grep -E '\.env|secret|credential|token' | sort -u | head -50 || echo "(none)"

      - name: Scan history for EITAA_TOKEN pattern (presence-only, redacted)
        id: hist_token
        run: |
          set -euo pipefail
          echo "=== Historical EITAA_TOKEN Pattern Scan (REDACTED) ==="

          # Robust presence-only detection across all history.
          # We intentionally avoid printing any matching lines or blob content.
          #
          # Method 1: pickaxe (-S) — commits that introduced/removed the string
          # Method 2: regex pickaxe (-G) — broader match if needed
          # Method 3: count matching blobs via git grep with output discarded

          FOUND=0

          # -S: history of commits that changed the number of occurrences of the string
          if [ -n "$(git log --all --pretty=format:'%H' -S'EITAA_TOKEN' 2>/dev/null | head -1)" ]; then
            FOUND=1
          fi

          # -G: commits whose patch text matches the regex (still presence-only)
          if [ "$FOUND" -eq 0 ]; then
            if [ -n "$(git log --all --pretty=format:'%H' -G'EITAA_TOKEN' 2>/dev/null | head -1)" ]; then
              FOUND=1
            fi
          fi

          # Final fallback: search object contents but discard all output
          if [ "$FOUND" -eq 0 ]; then
            if git rev-list --all 2>/dev/null | xargs -r git grep -I -l -F 'EITAA_TOKEN' -- 2>/dev/null | grep -q .; then
              FOUND=1
            fi
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "EITAA_TOKEN string in history: FOUND"
            echo "Potential credential detected: REDACTED"
          else
            echo "EITAA_TOKEN string in history: NOT_FOUND"
          fi

          echo "(Matching content intentionally suppressed — only presence is reported)"

      - name: Summary report
        run: |
          set -euo pipefail
          echo ""
          echo "=============================================="
          echo "  DETECTION SUMMARY (no secrets printed)"
          echo "=============================================="
          echo "Repository        : ${{ github.repository }}"
          echo "Commit SHA        : ${{ github.sha }}"
          echo "Mode              : ${{ inputs.mode }}"
          echo "Safety checks     : ${{ steps.safety.outputs.safety_ok }}"
          echo "=============================================="
          echo "This job is detection-only."
          echo "No history was rewritten."
          echo "No force-push was performed."
          echo "=============================================="

  # ---------------------------------------------------------------
  # FUTURE DESTRUCTIVE PHASE (INTENTIONALLY DISABLED IN THIS PR)
  # ---------------------------------------------------------------
  # To enable later:
  #   1. Create a follow-up PR that removes the hard `if: false` guard.
  #   2. Require confirmation input == "REMOVE-HISTORICAL-SECRETS".
  #   3. Raise permissions carefully (contents: write) or use a dedicated token.
  #   4. Run only on a temporary branch / isolated runner, never directly on main.
  #   5. Create a safety tag / mirror backup before any rewrite.
  #
  # Primary rewrite strategy for this repository:
  #   The known secret lived in the tracked file `.env`.
  #   Removing `.env` from every historical commit is therefore the
  #   correct and sufficient first action.
  #
  #   git filter-repo --path .env --invert-paths
  #
  # If detection later shows residual secret *values* in other files,
  # those must be scrubbed with a local, uncommitted replacements file
  # that is NEVER committed, NEVER logged, and NEVER embedded in this
  # workflow. Do not replace only the key name "EITAA_TOKEN" — that
  # leaves the actual token value intact.
  #
  # The job below will currently always skip / fail closed.
  rewrite-history:
    name: Phase 2 — Future Rewrite (DISABLED)
    runs-on: ubuntu-latest
    needs: detect-secrets
    if: false   # HARD DISABLE — remove only in a deliberate future PR
    # if: ${{ inputs.mode == 'rewrite' && inputs.confirmation == 'REMOVE-HISTORICAL-SECRETS' }}

    # When eventually enabled, permissions would need to be raised carefully:
    # permissions:
    #   contents: write

    steps:
      - name: Refuse unless explicitly enabled
        run: |
          echo "Destructive rewrite is DISABLED in this workflow version."
          echo "A future PR must deliberately enable it after review."
          exit 1

      # Placeholder outline for a future controlled implementation
      # (DO NOT ENABLE in this PR):
      #
      # - name: Install git-filter-repo
      #   run: pip install git-filter-repo
      #
      # - name: Create safety backup reference
      #   run: |
      #     git tag "backup/pre-secret-cleanup-$(date +%Y%m%d-%H%M%S)"
      #     # Push the backup tag only after explicit review
      #
      # - name: Remove .env from all history (primary action)
      #   run: |
      #     # This is the correct primary rewrite for the known leak.
      #     # The revoked token lived in the tracked .env file.
      #     git filter-repo --path .env --invert-paths --force
      #
      # - name: Optional residual value scrub (only if still needed)
      #   run: |
      #     # ONLY if detection still finds the raw token value in other files.
      #     # Create a local replacements file on the runner (never commit it).
      #     # Format of each line: <literal-secret-value>==>REDACTED
      #     # The real value must come from a secure secret store / manual
      #     # input that is not written to the repository or workflow YAML.
      #     #
      #     # Example (illustrative only — do not hard-code real values):
      #     #   printf '%s\n' "<VALUE_FROM_SECURE_SOURCE>==>REDACTED" > /tmp/replacements.txt
      #     #   git filter-repo --replace-text /tmp/replacements.txt --force
      #     #   shred -u /tmp/replacements.txt
      #
      # - name: Re-run detection and fail if secrets remain
      #   run: |
      #     # Re-execute the same presence-only checks; exit non-zero on FOUND
