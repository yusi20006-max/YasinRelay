name: Fetcher E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fetcher-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: fetcher/go.mod

      - name: Build openfeed-fetch
        working-directory: fetcher
        run: go build -o openfeed-fetch .

      - name: Verify binary
        run: test -x fetcher/openfeed-fetch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run full test suite
        run: pytest -q
