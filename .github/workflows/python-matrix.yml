name: Yasin Relay Python Matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Checkout canonical Yasin-AI sibling
        uses: actions/checkout@v4
        with:
          repository: yusi20006-max/Yasin-AI
          path: Yasin-AI
      - name: Install canonical Yasin-AI contract
        run: pip install -e ./Yasin-AI
      - run: pip install -e .
      - run: pip install pytest
      # Avoid basename collision with Yasin-AI/tests/test_termux_bootstrap.py
      - run: pytest -q --ignore=Yasin-AI
